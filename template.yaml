AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Image Analysis - Root Stack

Parameters:
  ProjectName:
    Type: String
    Default: image-analysis
    Description: Tag value for Project
  ExamplePowertoolsPython:
    Type: String
    Description: ExamplePowertoolsPython Layer ARN
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Lambda log level
  SubDomain:
    Type: String
    Default: image-analysis
    Description: Subdomain for custom URL
  BaseDomainName:
    Type: String
    Default: example-cloud.com
    Description: Base domain name for custom URL
  OriginVerifyValue:
    Type: String
    NoEcho: true
    Description: Secret value for origin verification (provide via SSM at deploy time)
  AllowedImageBuckets:
    Type: String
    Default: ""
    Description: Comma-separated list of S3 buckets allowed for image_bucket input (empty = deny all)
  AnthropicWorkspaceId:
    Type: String
    Default: ""
    Description: Claude Platform on AWS workspace ID (empty until workspace is provisioned)
  DefaultModel:
    Type: String
    Default: anthropic.claude-sonnet-5
    Description: Default Claude model when request omits model
  ModelCatalogBucket:
    Type: String
    Default: ai-model-selector-data-210000000001
    Description: ai-model-selector data bucket used for grade-to-model resolution
  ModelCatalogProfile:
    Type: String
    Default: vision-judgment
    Description: ai-model-selector profile used for grade-to-model resolution
  LineNotifyTo:
    Type: String
    Default: ""
    Description: LINE Messaging API push destination userId or groupId
  NotifyRecipients:
    Type: String
    Default: devA@example.co.jp
    Description: 通知先メールアドレス（カンマ区切り）
  HostedZoneId:
    Type: String
    Default: Z0EXAMPLEZONE0
    Description: Route53 ホストゾーンID（SES DKIM CNAME登録先）

Resources:
  ApiStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./api/template.yaml
      Parameters:
        ResourcePrefix: !Ref AWS::StackName
        ProjectName: !Ref ProjectName
        ExamplePowertoolsPython: !Ref ExamplePowertoolsPython
        LogLevel: !Ref LogLevel
        OriginVerifyValue: !Ref OriginVerifyValue
        AllowedImageBuckets: !Ref AllowedImageBuckets
        SiteOrigin: !Sub 'https://${SubDomain}.${BaseDomainName}'
        AnthropicWorkspaceId: !Ref AnthropicWorkspaceId
        DefaultModel: !Ref DefaultModel
        ModelCatalogBucket: !Ref ModelCatalogBucket
        ModelCatalogProfile: !Ref ModelCatalogProfile
        LineNotifyTo: !Ref LineNotifyTo
        SesDomain: !Sub '${SubDomain}.${BaseDomainName}'
        SesSenderAddress: !Sub 'noreply@${SubDomain}.${BaseDomainName}'
        NotifyRecipients: !Ref NotifyRecipients
        HostedZoneId: !Ref HostedZoneId

  WebStack:
    Type: AWS::Serverless::Application
    DependsOn: ApiStack
    Properties:
      Location: ./web/template.yaml
      Parameters:
        ResourcePrefix: !Ref AWS::StackName
        ApiDomainName: !Sub
          - "${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
          - ApiId: !GetAtt ApiStack.Outputs.RestApiId
        ProjectName: !Ref ProjectName
        SubDomain: !Ref SubDomain
        BaseDomainName: !Ref BaseDomainName
        OriginVerifyValue: !Ref OriginVerifyValue

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !GetAtt ApiStack.Outputs.ApiEndpoint
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !GetAtt ApiStack.Outputs.CognitoUserPoolId
  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !GetAtt ApiStack.Outputs.CognitoUserPoolClientId
  CustomDomainUrl:
    Description: Custom domain URL
    Value: !GetAtt WebStack.Outputs.CustomDomainUrl
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !GetAtt WebStack.Outputs.CloudFrontDistributionId
  WebsiteBucketName:
    Description: S3 Bucket for website
    Value: !GetAtt WebStack.Outputs.WebsiteBucketName
  ApiKeySecretArn:
    Description: Secrets Manager ARN for API Key
    Value: !GetAtt ApiStack.Outputs.ApiKeySecretArn
