AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Image Analysis API - API stack

Parameters:
  ResourcePrefix:
    Type: String
    Description: Prefix for resource naming (passed from parent stack)
  OriginVerifyHeader:
    Type: String
    Default: x-origin-verify
    Description: Custom header name for CloudFront origin verification
  OriginVerifyValue:
    Type: String
    NoEcho: true
    Description: Secret value for origin verification (passed from parent stack / SSM)
  AllowedImageBuckets:
    Type: String
    Default: ""
    Description: Comma-separated list of S3 buckets allowed for image_bucket input (empty = deny all)
  SiteOrigin:
    Type: String
    Default: https://image-analysis.example-cloud.com
    Description: Allowed CORS origin (site URL)
  AnthropicWorkspaceId:
    Type: String
    Default: ""
    Description: Claude Platform on AWS workspace ID (empty until workspace is provisioned)
  DefaultModel:
    Type: String
    Default: anthropic.claude-sonnet-5
    Description: Default Claude model when request omits model
  ModelCatalogBucket:
    Type: String
    Default: ai-model-selector-data-210000000001
    Description: ai-model-selector data bucket used for grade-to-model resolution
  ModelCatalogProfile:
    Type: String
    Default: vision-judgment
    Description: ai-model-selector profile used for grade-to-model resolution
  BedrockJpRegion:
    Type: String
    Default: ap-northeast-1
    Description: Amazon Bedrock region for models available in Japan
  BedrockUsRegion:
    Type: String
    Default: us-east-1
    Description: Amazon Bedrock region for Claude models available in the US
  BedrockGptRegion:
    Type: String
    Default: us-east-2
    Description: Amazon Bedrock region for GPT models
  LineNotifyTo:
    Type: String
    Default: ""
    Description: LINE Messaging API push destination userId or groupId
  ProjectName:
    Type: String
    Default: image-analysis
    Description: Tag value for Project
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Lambda log level
  ExamplePowertoolsPython:
    Type: String
    Description: ExamplePowertoolsPython Layer ARN
  SesDomain:
    Type: String
    Default: image-analysis.example-cloud.com
    Description: SES送信元ドメイン（DKIM検証する）
  SesSenderAddress:
    Type: String
    Default: noreply@image-analysis.example-cloud.com
    Description: 通知メールのFromアドレス（SesDomain配下）
  NotifyRecipients:
    Type: String
    Default: devA@example.co.jp
    Description: 通知先メールアドレス（カンマ区切り）
  HostedZoneId:
    Type: String
    Default: Z0EXAMPLEZONE0
    Description: Route53 ホストゾーンID（DKIM CNAME登録先）

Globals:
  Function:
    Timeout: 60
    Runtime: python3.12
    MemorySize: 512

Conditions:
  HasAllowedBuckets: !Not [!Equals [!Ref AllowedImageBuckets, ""]]

Resources:
  LineImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLineNotificationImages
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: Bucket

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ResourcePrefix}-user-pool'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        Project: !Ref ProjectName
        Name: UserPool

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ResourcePrefix}-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  ImageAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-api'
      CodeUri: ../lambda/
      Handler: handler.lambda_handler
      Timeout: 300
      Tags:
        Project: !Ref ProjectName
        Name: Function
      Layers:
        - !Ref ExamplePowertoolsPython
      Environment:
        Variables:
          ORIGIN_VERIFY_HEADER: !Ref OriginVerifyHeader
          ORIGIN_VERIFY_VALUE: !Ref OriginVerifyValue
          ALLOWED_IMAGE_BUCKETS: !Ref AllowedImageBuckets
          ALLOWED_ORIGIN: !Ref SiteOrigin
          ANTHROPIC_AWS_WORKSPACE_ID: !Ref AnthropicWorkspaceId
          DEFAULT_MODEL: !Ref DefaultModel
          MODEL_CATALOG_BUCKET: !Ref ModelCatalogBucket
          MODEL_CATALOG_PROFILE: !Ref ModelCatalogProfile
          BEDROCK_JP_REGION: !Ref BedrockJpRegion
          BEDROCK_US_REGION: !Ref BedrockUsRegion
          BEDROCK_GPT_REGION: !Ref BedrockGptRegion
          SES_SENDER: !Ref SesSenderAddress
          NOTIFY_RECIPIENTS: !Ref NotifyRecipients
          LINE_IMAGES_BUCKET: !Ref LineImagesBucket
          LINE_NOTIFY_TO: !Ref LineNotifyTo
          LINE_TOKEN_PARAM: /image-analysis/line-channel-access-token
          LogLevel: !Ref LogLevel
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: image-analysis/*
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:aws:s3:::${ModelCatalogBucket}/profiles/*'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: aws-external-anthropic:CreateInference
              Resource: '*'
            - Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: '*'
            - Effect: Allow
              Action:
                - sts:GetWebIdentityToken
                - sts:TagGetWebIdentityToken
              Resource: !Sub 'arn:aws:sts::${AWS::AccountId}:self'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesDomain}"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${LineImagesBucket.Arn}/*'
        - !If
          - HasAllowedBuckets
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Split
                  - ","
                  - !Sub
                    - "arn:aws:s3:::${Inner}/*"
                    - Inner: !Join
                        - "/*,arn:aws:s3:::"
                        - !Split [",", !Ref AllowedImageBuckets]
          - !Ref AWS::NoValue
      Events:
        AnalyzeApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /analyze
            Method: POST
        WorkflowAnalyzeApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /workflow/analyze
            Method: POST
            Auth:
              Authorizer: NONE
              ApiKeyRequired: true
        CompareApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /compare
            Method: POST
        WorkflowCompareApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /workflow/compare
            Method: POST
            Auth:
              Authorizer: NONE
              ApiKeyRequired: true
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowOrigin: !Sub "'${SiteOrigin}'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
      Tags:
        Project: !Ref ProjectName
        Name: Api

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - RestApiprodStage
    Properties:
      Name: !Sub '${ResourcePrefix}-api-key'
      Enabled: true
      StageKeys:
        - RestApiId: !Ref RestApi
          StageName: prod
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: ApiKey

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - RestApiprodStage
    Properties:
      UsagePlanName: !Sub '${ResourcePrefix}-usage-plan'
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: prod
      Throttle:
        RateLimit: 10
        BurstLimit: 20
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: UsagePlan

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ResourcePrefix}/api-key'
      Description: API Gateway API Key for workflow endpoint
      SecretString: !Sub |
        {"apiKeyId":"${ApiKey}","apiKeyValue":"INITIAL_DEPLOY","usagePlanId":"${UsagePlan}","restApiId":"${RestApi}","stageName":"prod","resourcePrefix":"${ResourcePrefix}"}
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Name
          Value: ApiKeySecret

  ApiKeyRotationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-api-key-rotation'
      CodeUri: ../lambda/
      Handler: rotation.lambda_handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 128
      Layers:
        - !Ref ExamplePowertoolsPython
      Tags:
        Project: !Ref ProjectName
        Name: RotationFunction
      Environment:
        Variables:
          LogLevel: !Ref LogLevel
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
                - secretsmanager:PutSecretValue
                - secretsmanager:UpdateSecretVersionStage
              Resource: !Ref ApiKeySecret
            - Effect: Allow
              Action:
                - apigateway:POST
                - apigateway:GET
                - apigateway:DELETE
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/apikeys'
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/apikeys/*'
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/usageplans/${UsagePlan}/keys'
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/usageplans/${UsagePlan}/keys/*'

  RotationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiKeyRotationFunction
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com
      SourceArn: !Ref ApiKeySecret

  ApiKeyRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: RotationLambdaPermission
    Properties:
      SecretId: !Ref ApiKeySecret
      RotationLambdaARN: !GetAtt ApiKeyRotationFunction.Arn
      RotationRules:
        AutomaticallyAfterDays: 90

  SesIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SesDomain
      DkimAttributes:
        SigningEnabled: true

  SesDkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: "1800"
      ResourceRecords:
        - !GetAtt SesIdentity.DkimDNSTokenValue1

  SesDkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: "1800"
      ResourceRecords:
        - !GetAtt SesIdentity.DkimDNSTokenValue2

  SesDkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt SesIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: "1800"
      ResourceRecords:
        - !GetAtt SesIdentity.DkimDNSTokenValue3

Outputs:
  RestApiId:
    Description: API Gateway REST API ID
    Value: !Ref RestApi

  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient

  ApiKeyId:
    Description: API Key ID
    Value: !Ref ApiKey

  ApiKeySecretArn:
    Description: Secrets Manager ARN for API Key
    Value: !Ref ApiKeySecret
